name: neuronest
x-core-env: &core-env
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/dev-init.py}
  DATABASE_URL: postgresql://neuronest:${POSTGRES_PASSWORD:?}@postgres:5432/neuronest
  CELERY_BROKER_URL: amqp://neuronest:${RABBITMQ_PASSWORD:?}@rabbitmq:5672//
  OUTBOX_WORKER_ENABLED: "true"
  IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-firebase}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in .env}
  FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:?Set FIREBASE_WEB_API_KEY in .env}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:?Set FIREBASE_SERVICE_ACCOUNT_JSON in .env}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  USERNAME_RATE_LIMIT_HMAC_KEY: ${USERNAME_RATE_LIMIT_HMAC_KEY:-${DJANGO_SECRET_KEY:?Run scripts/dev-init.py}}
  ALLOWED_HOSTS: localhost,127.0.0.1,core
  CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:-http://localhost:5173},http://localhost:5173,http://127.0.0.1:5173,http://localhost:8082,http://127.0.0.1:8082
  CSRF_TRUSTED_ORIGINS: ${WEB_ORIGIN:-http://localhost:5173}
  PRIVATE_MEDIA_ROOT: /data/private
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  ASSISTANT_URL: http://assistant:8001
  DIAGNOSTIC_URL: http://diagnostic:8002
  ENGINE_SERVICE_TOKEN: ${ENGINE_SERVICE_TOKEN:?}
  LIVEKIT_URL: ws://localhost:7880
  LIVEKIT_INTERNAL_URL: http://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-neuronest-local}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
services:
  postgres:
    networks: [database]
    image: postgres:17-alpine
    ports: ["127.0.0.1:5433:5432"]
    environment:
      POSTGRES_DB: neuronest
      POSTGRES_USER: neuronest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U neuronest -d neuronest"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    networks: [jobs]
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: neuronest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  clamav:
    networks: [scanner]
    image: clamav/clamav-debian:1.4
    volumes: [clamav-data:/var/lib/clamav]
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped
  livekit:
    networks: [rtc]
    image: livekit/livekit-server:v1.8
    command: [--config, /etc/livekit.yaml]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes: ["./infra/livekit.yaml:/etc/livekit.yaml:ro"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    restart: unless-stopped
  core:
    image: neuronest-core:latest
    networks: [database, jobs, engines, rtc]
    build: ./services/core
    environment: *core-env
    ports: ["127.0.0.1:${CORE_PORT:-8000}:8000"]
    volumes: [private-records:/data/private]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    healthcheck:
      test:
        [
          CMD-SHELL,
          "celery -A neuronest inspect ping --destination=celery@$$HOSTNAME --timeout=5",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    image: neuronest-core:latest
    networks: [database, jobs, scanner, rtc]
    build: ./services/core
    command: [celery, -A, neuronest, worker, --loglevel=info, --concurrency=1]
    environment: *core-env
    volumes: [private-records:/data/private]
    depends_on:
      core: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
  beat:
    image: neuronest-core:latest
    networks: [database, jobs]
    build: ./services/core
    command:
      [
        celery,
        -A,
        neuronest,
        beat,
        --loglevel=info,
        --schedule=/tmp/celerybeat-schedule,
      ]
    environment: *core-env
    depends_on:
      core: { condition: service_healthy }
    restart: unless-stopped
  assistant:
    networks: [engines]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    build: ./services/assistant
    environment:
      ENGINE_SERVICE_TOKEN: ${ENGINE_SERVICE_TOKEN:?}
      APP_ENV: development
      ALLOW_PATIENT_AI: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    restart: unless-stopped
  diagnostic:
    networks: [engines]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    build: ./services/diagnostic
    environment:
      ENGINE_SERVICE_TOKEN: ${ENGINE_SERVICE_TOKEN:?}
      APP_ENV: development
      ALLOW_PATIENT_AI: "false"
    restart: unless-stopped
volumes:
  postgres-data:
  rabbitmq-data:
  clamav-data:
  private-records:

networks:
  database:
  jobs:
  engines:
  scanner:
  rtc:
